services:
  postgres:
    image: postgres:16-alpine
    container_name: liyanza_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U liyanza_user -d liyanza_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - liyanza_network

  redis:
    image: redis:7-alpine
    container_name: liyanza_redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - liyanza_network

  api:
    build: .
    container_name: liyanza_api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # CORRECTIF AUDIT (majeur — conteneur incapable de démarrer) : quatre
      # variables déclarées `@IsDefined()` dans `src/config/env.validation.ts`
      # étaient absentes de ce bloc : NODE_ENV, CORS_ORIGINS,
      # JWT_VALIDATION_SECRET et VALIDATION_BASE_URL. La validation stricte au
      # démarrage faisait donc échouer `docker compose up` systématiquement —
      # l'environnement Docker documenté dans le README n'était pas
      # fonctionnel.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # NOTE: En local via Docker Compose, on utilise le nom du service comme hostname
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_VALIDATION_SECRET: ${JWT_VALIDATION_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      VALIDATION_BASE_URL: ${VALIDATION_BASE_URL:-http://localhost:3000/validation}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - liyanza_network

volumes:
  postgres_data:

networks:
  liyanza_network:
    driver: bridge
