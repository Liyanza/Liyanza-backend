services:
  postgres:
    image: postgres:16-alpine
    container_name: liyanza_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U liyanza_user -d liyanza_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - liyanza_network

  redis:
    image: redis:7-alpine
    container_name: liyanza_redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - liyanza_network

  # Serveur SMTP de développement (BACK-302) : capture les emails envoyés par
  # NotificationsProcessor sans les délivrer réellement, consultables sur
  # http://localhost:8025. N'est utilisé qu'en local — Render pointera vers
  # un vrai relais SMTP via les variables d'environnement du dashboard.
  #
  # CORRECTIF : `mailhog/mailhog` (projet MailHog original) est archivé/non
  # maintenu et son image `v1.0.1` sur Docker Hub est cassée (démarrage en
  # échec : `unable to find user mailhog: no matching entries in passwd
  # file`). Remplacé par Mailpit, le successeur actif recommandé par la
  # communauté MailHog elle-même — même usage, mêmes ports (1025 SMTP, 8025
  # UI web), aucun changement côté `SmtpEmailProvider`.
  mailhog:
    image: axllent/mailpit:v1.20.4
    container_name: liyanza_mailhog
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    networks:
      - liyanza_network

  # Stockage médias S3-compatible de développement (BACK-307) : MinIO expose
  # la même API que S3/R2/B2, consultable sur http://localhost:9001 (identifiants
  # ci-dessous). N'est utilisé qu'en local — Render pointera vers un vrai
  # fournisseur S3-compatible via les variables d'environnement du dashboard.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: liyanza_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-liyanza_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-liyanza_minio_password}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - liyanza_network

  # Conteneur "one-shot" : crée le bucket au démarrage (MinIO ne le fait pas
  # automatiquement), puis se termine. Ré-exécuté à chaque `docker compose
  # up` mais idempotent (`--ignore-existing`).
  minio-createbucket:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: liyanza_minio_createbucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-liyanza_minio_admin} ${S3_SECRET_ACCESS_KEY:-liyanza_minio_password} &&
      mc mb --ignore-existing local/${S3_BUCKET:-liyanza-media}
      "
    networks:
      - liyanza_network

  api:
    build: .
    container_name: liyanza_api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # CORRECTIF AUDIT (majeur — conteneur incapable de démarrer) : quatre
      # variables déclarées `@IsDefined()` dans `src/config/env.validation.ts`
      # étaient absentes de ce bloc : NODE_ENV, CORS_ORIGINS,
      # JWT_VALIDATION_SECRET et VALIDATION_BASE_URL. La validation stricte au
      # démarrage faisait donc échouer `docker compose up` systématiquement —
      # l'environnement Docker documenté dans le README n'était pas
      # fonctionnel.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # NOTE: En local via Docker Compose, on utilise le nom du service comme hostname
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_VALIDATION_SECRET: ${JWT_VALIDATION_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      VALIDATION_BASE_URL: ${VALIDATION_BASE_URL:-http://localhost:3000/validation}
      QR_CODE_BASE_URL: ${QR_CODE_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-notifications@liyanza.local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-liyanza-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-liyanza_minio_admin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-liyanza_minio_password}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      minio-createbucket:
        condition: service_completed_successfully
    networks:
      - liyanza_network

volumes:
  postgres_data:
  minio_data:

networks:
  liyanza_network:
    driver: bridge
