name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Synchronisation du lockfile sans exécuter les scripts (évite "husky not found")
      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build project
        run: npm run build

  test:
    name: Test (unit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: liyanza_user
          POSTGRES_PASSWORD: liyanza_password
          POSTGRES_DB: liyanza_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run unit tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://liyanza_user:liyanza_password@localhost:5432/liyanza_db

  # Déploiement sur l'EC2 « kiyanza-backend » (voir deploy/aws/README.md), à
  # chaque push sur main une fois lint, build et tests passés. Aucune clé AWS
  # dans GitHub : le job reçoit des identifiants temporaires par OIDC, via le
  # rôle github-deploy-backend (limité à ce dépôt, à main, au dépôt du code
  # et à Session Manager sur cette instance).
  deploy:
    name: Deploy (AWS)
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-west-3
      INSTANCE_ID: i-092ed836d43e8cec5
      BUNDLE_URI: s3://kiyanza-backend-backups-922640335967/deploy/backend.bundle
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::922640335967:role/github-deploy-backend
          aws-region: ${{ env.AWS_REGION }}

      # Le serveur n'a aucun accès à GitHub : le code lui parvient en bundle git.
      - name: Upload code bundle
        run: |
          git branch -f deploy HEAD
          git bundle create backend.bundle refs/heads/deploy
          aws s3 cp backend.bundle "$BUNDLE_URI" --only-show-errors

      - name: Deploy on EC2
        run: |
          commands=$(jq -nc --arg uri "$BUNDLE_URI" '[
            "set -eu",
            "cd /opt/kiyanza/backend",
            "aws s3 cp \($uri) /tmp/backend.bundle --only-show-errors",
            "sudo -u ubuntu git fetch -q /tmp/backend.bundle deploy",
            "sudo -u ubuntu git checkout -q -f -B main FETCH_HEAD",
            "sh deploy/aws/deploy.sh"
          ]')
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub ${GITHUB_SHA::7}" \
            --timeout-seconds 1200 \
            --parameters "{\"commands\":$commands,\"executionTimeout\":[\"1200\"]}" \
            --query Command.CommandId --output text)
          echo "Commande SSM : $id"

          status=InProgress
          for _ in $(seq 1 80); do
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -n 80
          echo "Statut : $status"
          [ "$status" = Success ]

      - name: Check public health
        run: curl -fsS --retry 5 --retry-delay 5 https://api.kiyanza.com/health
