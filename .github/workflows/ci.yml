name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  test:
    name: Test (unit)
    runs-on: ubuntu-latest
    # Service PostgreSQL éphémère pour les futurs tests d'intégration
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: liyanza_user
          POSTGRES_PASSWORD: liyanza_password
          POSTGRES_DB: liyanza_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test
        env:
          # Optionnel : pour préparer les futurs tests nécessitant la DB
          DATABASE_URL: postgresql://liyanza_user:liyanza_password@localhost:5432/liyanza_db
          # On peut aussi définir d'autres variables d'environnement si besoin

  # Job optionnel pour les tests e2e (peut être ajouté plus tard)
  # e2e:
  #   name: E2E tests
  #   runs-on: ubuntu-latest
  #   ...
